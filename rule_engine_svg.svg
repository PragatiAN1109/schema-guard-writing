<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" font-family="'Courier New', Courier, monospace">

  <defs>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#eaeef2"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f6ff"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff8f0"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f0"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fff4"/>
    </linearGradient>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="580" fill="url(#bgMain)"/>

  <!-- Header band -->
  <rect width="1280" height="72" fill="#0d1117"/>
  <text x="640" y="30" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="3">SCHEMAGUARD</text>
  <text x="640" y="54" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold" letter-spacing="1">RULE ENGINE — HOW A CONSTRAINT FIRES</text>

  <!-- Step labels row -->
  <text x="148" y="100" text-anchor="middle" fill="#57606a" font-size="10" letter-spacing="2">STEP 1</text>
  <text x="432" y="100" text-anchor="middle" fill="#57606a" font-size="10" letter-spacing="2">STEP 2</text>
  <text x="716" y="100" text-anchor="middle" fill="#57606a" font-size="10" letter-spacing="2">STEP 3</text>
  <text x="1000" y="100" text-anchor="middle" fill="#57606a" font-size="10" letter-spacing="2">STEP 4</text>

  <!-- ── CONNECTOR ARROWS between cards ── -->
  <!-- Arrow 1→2 -->
  <line x1="272" y1="300" x2="306" y2="300" stroke="#d0d7de" stroke-width="2"/>
  <polygon points="303,295 313,300 303,305" fill="#d0d7de"/>
  <!-- Arrow 2→3 -->
  <line x1="556" y1="300" x2="590" y2="300" stroke="#d0d7de" stroke-width="2"/>
  <polygon points="587,295 597,300 587,305" fill="#d0d7de"/>
  <!-- Arrow 3→4 split label -->
  <line x1="840" y1="300" x2="874" y2="300" stroke="#d0d7de" stroke-width="2"/>
  <polygon points="871,295 881,300 871,305" fill="#d0d7de"/>

  <!-- ═══════════════════════ STEP 1 — INPUT RECORD ═══════════════════════ -->
  <rect x="28" y="112" width="244" height="368" rx="10" fill="url(#stepGrad1)" stroke="#d0d7de" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="28" y="112" width="244" height="36" rx="10" fill="#0d1117"/>
  <rect x="28" y="130" width="244" height="18" fill="#0d1117"/>
  <text x="150" y="135" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="bold" letter-spacing="1">INPUT RECORD</text>

  <!-- JSON -->
  <text x="48" y="170" fill="#57606a" font-size="10">{</text>
  <text x="60" y="190" fill="#0550ae" font-size="10">"date_of_birth"</text>
  <text x="174" y="190" fill="#57606a" font-size="10">:</text>
  <text x="182" y="190" fill="#116329" font-size="10">"1991-03-15"</text>

  <text x="60" y="210" fill="#0550ae" font-size="10">"admission_date"</text>
  <text x="183" y="210" fill="#57606a" font-size="10">:</text>
  <text x="191" y="210" fill="#116329" font-size="10">"2023-11-02"</text>

  <!-- Highlighted bad field -->
  <rect x="56" y="220" width="202" height="18" rx="3" fill="#ffd7d5"/>
  <text x="60" y="232" fill="#0550ae" font-size="10">"diagnosis_onset"</text>
  <text x="181" y="232" fill="#57606a" font-size="10">:</text>
  <text x="189" y="232" fill="#cf222e" font-size="10" font-weight="bold">"1987-06-20"</text>

  <text x="48" y="252" fill="#57606a" font-size="10">}</text>

  <!-- Field extraction note -->
  <line x1="48" y1="268" x2="252" y2="268" stroke="#eaeef2" stroke-width="1"/>
  <text x="150" y="286" text-anchor="middle" fill="#57606a" font-size="9">3 fields extracted</text>

  <!-- Field pills -->
  <rect x="44" y="296" width="136" height="20" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text x="112" y="310" text-anchor="middle" fill="#0550ae" font-size="9">date_of_birth</text>

  <rect x="44" y="322" width="148" height="20" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1"/>
  <text x="118" y="336" text-anchor="middle" fill="#0550ae" font-size="9">admission_date</text>

  <rect x="44" y="348" width="160" height="20" rx="10" fill="#ffd7d5" stroke="#cf222e" stroke-width="1"/>
  <text x="124" y="362" text-anchor="middle" fill="#cf222e" font-size="9">diagnosis_onset_date</text>

  <line x1="48" y1="380" x2="252" y2="380" stroke="#eaeef2" stroke-width="1"/>
  <text x="150" y="396" text-anchor="middle" fill="#8c959f" font-size="8">passed to rule engine →</text>

  <!-- Step 1 icon -->
  <circle cx="222" cy="450" r="22" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="222" y="446" text-anchor="middle" fill="#0550ae" font-size="14">{}</text>
  <text x="222" y="462" text-anchor="middle" fill="#0550ae" font-size="8">parse</text>

  <!-- ═══════════════════════ STEP 2 — RULE LOOKUP ═══════════════════════ -->
  <rect x="312" y="112" width="244" height="368" rx="10" fill="url(#stepGrad2)" stroke="#d0d7de" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="312" y="112" width="244" height="36" rx="10" fill="#3d1f00"/>
  <rect x="312" y="130" width="244" height="18" fill="#3d1f00"/>
  <text x="434" y="135" text-anchor="middle" fill="#ffa657" font-size="11" font-weight="bold" letter-spacing="1">RULE REGISTRY</text>

  <text x="332" y="168" fill="#57606a" font-size="9" letter-spacing="1">REGISTERED RULES FOR SCHEMA</text>
  <line x1="332" y1="174" x2="536" y2="174" stroke="#eaeef2" stroke-width="1"/>

  <!-- Rule 1 -->
  <rect x="328" y="182" width="212" height="52" rx="6" fill="#fff8f0" stroke="#ffa657" stroke-width="1.5"/>
  <text x="340" y="198" fill="#953800" font-size="9" font-weight="bold" letter-spacing="0.5">RULE_001</text>
  <text x="340" y="213" fill="#57606a" font-size="9">onset_date ≥ date_of_birth</text>
  <text x="340" y="226" fill="#8c959f" font-size="8">domain: healthcare · type: temporal</text>

  <!-- Rule 2 -->
  <rect x="328" y="244" width="212" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="340" y="260" fill="#57606a" font-size="9" font-weight="bold" letter-spacing="0.5">RULE_002</text>
  <text x="340" y="275" fill="#57606a" font-size="9">admission ≥ date_of_birth</text>
  <text x="340" y="288" fill="#8c959f" font-size="8">domain: healthcare · type: temporal</text>

  <!-- Rule 3 -->
  <rect x="328" y="306" width="212" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="340" y="322" fill="#57606a" font-size="9" font-weight="bold" letter-spacing="0.5">RULE_003</text>
  <text x="340" y="337" fill="#57606a" font-size="9">admission ≤ today's date</text>
  <text x="340" y="350" fill="#8c959f" font-size="8">domain: healthcare · type: temporal</text>

  <!-- Match indicator -->
  <line x1="332" y1="370" x2="536" y2="370" stroke="#eaeef2" stroke-width="1"/>
  <text x="434" y="388" text-anchor="middle" fill="#57606a" font-size="9">RULE_001 matches field set</text>
  <rect x="362" y="396" width="144" height="22" rx="11" fill="#fff3cd" stroke="#d4a017" stroke-width="1"/>
  <text x="434" y="411" text-anchor="middle" fill="#7d4e17" font-size="9" font-weight="bold">→ RULE_001 selected</text>

  <!-- Step 2 icon -->
  <circle cx="506" cy="450" r="22" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="506" y="446" text-anchor="middle" fill="#7d4e17" font-size="14">≡</text>
  <text x="506" y="462" text-anchor="middle" fill="#7d4e17" font-size="8">lookup</text>

  <!-- ═══════════════════════ STEP 3 — EVALUATION ═══════════════════════ -->
  <rect x="596" y="112" width="244" height="368" rx="10" fill="url(#stepGrad3)" stroke="#d0d7de" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="596" y="112" width="244" height="36" rx="10" fill="#3d0000"/>
  <rect x="596" y="130" width="244" height="18" fill="#3d0000"/>
  <text x="718" y="135" text-anchor="middle" fill="#f78166" font-size="11" font-weight="bold" letter-spacing="1">EVALUATION</text>

  <text x="616" y="168" fill="#57606a" font-size="9" letter-spacing="1">APPLYING RULE_001</text>
  <line x1="616" y1="174" x2="820" y2="174" stroke="#eaeef2" stroke-width="1"/>

  <!-- Rule statement -->
  <rect x="612" y="182" width="212" height="30" rx="5" fill="#ffd7d5" stroke="#cf222e" stroke-width="1"/>
  <text x="718" y="202" text-anchor="middle" fill="#cf222e" font-size="10" font-weight="bold">onset_date ≥ date_of_birth</text>

  <!-- Values -->
  <text x="616" y="234" fill="#57606a" font-size="9" letter-spacing="1">FIELD VALUES EXTRACTED</text>

  <rect x="612" y="242" width="212" height="28" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="622" y="256" fill="#57606a" font-size="9">diagnosis_onset</text>
  <text x="622" y="268" fill="#cf222e" font-size="10" font-weight="bold">1987-06-20</text>

  <rect x="612" y="278" width="212" height="28" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="622" y="292" fill="#57606a" font-size="9">date_of_birth</text>
  <text x="622" y="304" fill="#116329" font-size="10" font-weight="bold">1991-03-15</text>

  <!-- Comparison -->
  <text x="718" y="332" text-anchor="middle" fill="#57606a" font-size="9">COMPARISON</text>
  <rect x="632" y="338" width="172" height="28" rx="5" fill="#ffd7d5" stroke="#cf222e" stroke-width="1.5"/>
  <text x="718" y="357" text-anchor="middle" fill="#cf222e" font-size="11" font-weight="bold">1987 &lt; 1991 → FALSE</text>

  <!-- Result badge -->
  <rect x="642" y="376" width="152" height="28" rx="14" fill="#cf222e"/>
  <text x="718" y="394" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold" letter-spacing="1">RULE VIOLATED ✗</text>

  <!-- Step 3 icon -->
  <circle cx="790" cy="450" r="22" fill="#ffd7d5" stroke="#cf222e" stroke-width="1.5"/>
  <text x="790" y="446" text-anchor="middle" fill="#cf222e" font-size="16">✗</text>
  <text x="790" y="462" text-anchor="middle" fill="#cf222e" font-size="8">fail</text>

  <!-- ═══════════════════════ STEP 4 — OUTPUT ═══════════════════════ -->
  <rect x="880" y="112" width="372" height="368" rx="10" fill="url(#stepGrad4)" stroke="#d0d7de" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="880" y="112" width="372" height="36" rx="10" fill="#0a2e14"/>
  <rect x="880" y="130" width="372" height="18" fill="#0a2e14"/>
  <text x="1066" y="135" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="bold" letter-spacing="1">OUTPUT + AUDIT LOG</text>

  <!-- Quarantine badge -->
  <rect x="896" y="152" width="340" height="38" rx="6" fill="#fff3cd" stroke="#d4a017" stroke-width="1.5"/>
  <text x="1066" y="167" text-anchor="middle" fill="#7d4e17" font-size="10" font-weight="bold">⊘  ROUTED TO QUARANTINE</text>
  <text x="1066" y="182" text-anchor="middle" fill="#953800" font-size="9">confidence score below threshold</text>

  <!-- Log entry -->
  <text x="900" y="210" fill="#57606a" font-size="9" letter-spacing="1">AUDIT LOG ENTRY</text>
  <line x1="900" y1="216" x2="1236" y2="216" stroke="#eaeef2" stroke-width="1"/>

  <rect x="896" y="224" width="340" height="188" rx="6" fill="#0d1117"/>

  <text x="912" y="244" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="244" fill="#8b949e" font-size="9">record_id</text>
  <text x="1012" y="244" fill="#e6edf3" font-size="9">: "rec_20231102_0847"</text>

  <text x="912" y="260" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="260" fill="#8b949e" font-size="9">timestamp</text>
  <text x="1012" y="260" fill="#e6edf3" font-size="9">: "2023-11-02T08:47:03Z"</text>

  <text x="912" y="276" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="276" fill="#8b949e" font-size="9">rule_fired</text>
  <text x="1012" y="276" fill="#ffa657" font-size="9">: "RULE_001"</text>

  <text x="912" y="292" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="292" fill="#8b949e" font-size="9">fields</text>
  <text x="1012" y="292" fill="#f78166" font-size="9">: ["diagnosis_onset",</text>
  <text x="1012" y="306" fill="#f78166" font-size="9">   "date_of_birth"]</text>

  <text x="912" y="322" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="322" fill="#8b949e" font-size="9">values</text>
  <text x="1012" y="322" fill="#e6edf3" font-size="9">: ["1987-06-20", "1991-03-15"]</text>

  <text x="912" y="338" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="338" fill="#8b949e" font-size="9">violation</text>
  <text x="1012" y="338" fill="#f78166" font-size="9">: "onset precedes birth"</text>

  <text x="912" y="354" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="354" fill="#8b949e" font-size="9">decision</text>
  <text x="1012" y="354" fill="#ffa657" font-size="9">: "QUARANTINE"</text>

  <text x="912" y="370" fill="#3fb950" font-size="9">$</text>
  <text x="924" y="370" fill="#8b949e" font-size="9">confidence</text>
  <text x="1012" y="370" fill="#e6edf3" font-size="9">: 0.12</text>

  <text x="912" y="390" fill="#3fb950" font-size="9" opacity="0.5">█</text>

  <!-- Step 4 icon -->
  <circle cx="1222" cy="450" r="22" fill="#d4f7de" stroke="#3fb950" stroke-width="1.5"/>
  <text x="1222" y="446" text-anchor="middle" fill="#116329" font-size="14">✓</text>
  <text x="1222" y="462" text-anchor="middle" fill="#116329" font-size="8">logged</text>

  <!-- ═══════════════════════ FOOTER ═══════════════════════ -->
  <rect x="0" y="540" width="1280" height="40" fill="#0d1117"/>
  <line x1="80" y1="540" x2="1200" y2="540" stroke="#21262d" stroke-width="1"/>
  <text x="640" y="564" text-anchor="middle" fill="#30363d" font-size="8" letter-spacing="2">EVERY DECISION IS EXTERNAL · DETERMINISTIC · AUDITABLE · NO SELF-EVALUATION BY THE MODEL</text>

</svg>
